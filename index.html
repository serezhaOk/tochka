<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прототип — карточки в невесомости</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #f4f4f4;
    --card-stroke: #ececec;
    --ink: #181818;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  /* Камера / 3D-сцена ------------------------------------------------ */
  .stage {
    position: fixed;
    inset: 0;
    perspective: 1100px;        /* глубина перспективы */
    perspective-origin: 50% 50%;
  }

  .world {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    /* наклон сцены вслед за курсором задаётся из JS через CSS-переменные */
    transform: rotateX(var(--ry, 0deg)) rotateY(var(--rx, 0deg));
    transition: transform 0.25s ease-out;
    will-change: transform;
  }

  /* Карточки --------------------------------------------------------- */
  .card {
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 26px;
    background: var(--card);
    border: 1px solid var(--card-stroke);
    transform-style: preserve-3d;
    /* позиция/глубина/параллакс собираются в одном transform из JS-переменных */
    transform:
      translate(-50%, -50%)
      translate3d(
        calc(var(--x) + var(--px, 0px)),
        calc(var(--y) + var(--py, 0px)),
        var(--z))
      rotate(var(--rot, 0deg));
    transition: transform 0.3s cubic-bezier(.2,.7,.2,1),
                opacity 0.5s ease,
                filter 0.5s ease;
    will-change: transform, opacity;
  }

  /* Набор, который сейчас скрыт (кросс-фейд) */
  .set--hidden .card {
    opacity: 0;
    filter: blur(4px);
    pointer-events: none;
  }
  .set--visible .card {
    opacity: 1;
    filter: blur(0);
  }

  /* Переключатель — статичный, поверх сцены ------------------------- */
  .toggle {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 50;
    display: flex;
    align-items: center;
    padding: 6px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    background: #fff;
    user-select: none;
  }

  .toggle__btn {
    position: relative;
    z-index: 2;
    border: 0;
    background: transparent;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 16px 26px;
    border-radius: 999px;
    color: var(--ink);
    white-space: nowrap;
    transition: color 0.3s ease;
  }
  .toggle__btn[aria-selected="true"] { color: #fff; }

  /* Бегунок-пилюля */
  .toggle__thumb {
    position: absolute;
    z-index: 1;
    top: 6px;
    bottom: 6px;
    border-radius: 999px;
    background: var(--ink);
    transition: left 0.35s cubic-bezier(.2,.7,.2,1),
                width 0.35s cubic-bezier(.2,.7,.2,1);
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    color: #bdbdbd;
    font-size: 13px;
    letter-spacing: .02em;
    z-index: 50;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="world" id="world">
      <!-- наборы карточек генерируются из JS -->
    </div>
  </div>

  <div class="toggle" id="toggle" role="tablist" aria-label="Режим">
    <span class="toggle__thumb" id="thumb"></span>
    <button class="toggle__btn" role="tab" aria-selected="true"  data-set="0">Начать своё дело</button>
    <button class="toggle__btn" role="tab" aria-selected="false" data-set="1">Управлять и развивать</button>
  </div>

  <div class="hint">двигай мышкой — осмотри пространство</div>

<script>
(() => {
  // --- Два набора по 8 карточек -----------------------------------
  // Каждая карточка: x/y — смещение от центра (px), z — глубина,
  // w/h — размеры, rot — лёгкий поворот в плоскости.
  // Параллакс силён для ближних (большой +z), слаб для дальних (-z).
  const SETS = [
    [ // Набор 0 — "Начать своё дело"
      { x:-560, y:-420, z: 120, w:340, h:175, rot:-4 },
      { x: 380, y:-330, z:-180, w:300, h:150, rot: 3 },
      { x:-700, y:  60, z: -60, w:280, h:185, rot: 5 },
      { x: 620, y:-110, z:  60, w:300, h:160, rot:-3 },
      { x:-260, y: 300, z: 200, w:320, h:170, rot: 2 },
      { x: 250, y: 330, z:-120, w:300, h:170, rot:-5 },
      { x: 700, y: 280, z: 100, w:260, h:150, rot: 4 },
      { x:-470, y:-130, z:-220, w:240, h:140, rot: 6 },
    ],
    [ // Набор 1 — "Управлять и развивать"
      { x:-620, y:-300, z: 180, w:300, h:160, rot: 5 },
      { x: 300, y:-400, z: -80, w:330, h:175, rot:-4 },
      { x: 660, y:-200, z: 140, w:270, h:150, rot: 3 },
      { x:-360, y: 250, z:-200, w:310, h:165, rot:-6 },
      { x: 200, y: 360, z:  80, w:300, h:170, rot: 4 },
      { x:-720, y: -40, z:  40, w:250, h:175, rot:-2 },
      { x: 560, y: 200, z:-140, w:320, h:160, rot: 5 },
      { x:-180, y:-440, z: 220, w:280, h:150, rot:-3 },
    ],
  ];

  const world = document.getElementById('world');

  // Создаём оба набора в DOM
  const setEls = SETS.map((cards, si) => {
    const wrap = document.createElement('div');
    wrap.className = 'set ' + (si === 0 ? 'set--visible' : 'set--hidden');
    cards.forEach(c => {
      const el = document.createElement('div');
      el.className = 'card';
      el.style.width  = c.w + 'px';
      el.style.height = c.h + 'px';
      el.style.setProperty('--x', c.x + 'px');
      el.style.setProperty('--y', c.y + 'px');
      el.style.setProperty('--z', c.z + 'px');
      el.style.setProperty('--rot', c.rot + 'deg');
      el.dataset.depth = c.z;   // для расчёта параллакса
      wrap.appendChild(el);
    });
    world.appendChild(wrap);
    return wrap;
  });

  // --- Параллакс + наклон сцены за курсором ------------------------
  let tx = 0, ty = 0;          // целевые нормализованные координаты (-1..1)
  let cx = 0, cy = 0;          // текущие (сглаженные)
  const MAX_TILT = 9;          // макс. наклон сцены, градусы
  const allCards = () => world.querySelectorAll('.card');

  window.addEventListener('pointermove', (e) => {
    tx = (e.clientX / window.innerWidth  - 0.5) * 2;
    ty = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  function loop() {
    // плавное догоняние курсора
    cx += (tx - cx) * 0.08;
    cy += (ty - cy) * 0.08;

    // наклон всей сцены (камера качается)
    world.style.setProperty('--rx', ( cx * MAX_TILT) + 'deg');
    world.style.setProperty('--ry', (-cy * MAX_TILT) + 'deg');

    // индивидуальный параллакс по глубине: ближние двигаются сильнее
    allCards().forEach(card => {
      const depth = parseFloat(card.dataset.depth);   // -220..220
      const k = (depth + 250) / 470;                  // 0..1, ближе = больше
      const amp = 18 + k * 55;
      card.style.setProperty('--px', (-cx * amp) + 'px');
      card.style.setProperty('--py', (-cy * amp) + 'px');
    });

    requestAnimationFrame(loop);
  }
  loop();

  // --- Переключатель ----------------------------------------------
  const toggle = document.getElementById('toggle');
  const thumb  = document.getElementById('thumb');
  const btns   = [...toggle.querySelectorAll('.toggle__btn')];

  function moveThumb(btn) {
    thumb.style.left  = btn.offsetLeft + 'px';
    thumb.style.width = btn.offsetWidth + 'px';
  }

  function select(idx) {
    btns.forEach((b, i) => b.setAttribute('aria-selected', i === idx));
    moveThumb(btns[idx]);
    setEls.forEach((s, i) => {
      s.classList.toggle('set--visible', i === idx);
      s.classList.toggle('set--hidden',  i !== idx);
    });
  }

  btns.forEach((b, i) => b.addEventListener('click', () => select(i)));

  // стартовая позиция бегунка (после раскладки)
  requestAnimationFrame(() => moveThumb(btns[0]));
  window.addEventListener('resize', () => {
    const active = btns.findIndex(b => b.getAttribute('aria-selected') === 'true');
    moveThumb(btns[active]);
  });
})();
</script>
</body>
</html>
