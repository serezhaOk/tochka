<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прототип — карточки в невесомости</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --ink: #181818;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  /* Камера / 3D-сцена ------------------------------------------------ */
  .stage {
    position: fixed;
    inset: 0;
    perspective: 1200px;
    perspective-origin: 50% 50%;
  }

  .world {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    /* лёгкое качание всей сцены за курсором (камера) */
    transform: rotateX(var(--ry, 0deg)) rotateY(var(--rx, 0deg));
    transition: transform 0.25s ease-out;
    will-change: transform;
  }

  /* Карточки --------------------------------------------------------- */
  .card {
    position: absolute;
    left: 50%;
    top: 50%;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 30px 20px 20px;
    border-radius: 30px;
    background: var(--card);
    box-shadow: 0 18px 50px -20px rgba(20,20,30,.22);
    transform-style: preserve-3d;
    /*
      Сборка трансформа:
      1) позиция в пространстве + параллакс (--px/--py) + глубина (--z)
      2) сферический доворот вокруг своих осей (--sry/--srx) —
         тем сильнее, чем дальше карточка от центра экрана
    */
    transform:
      translate(-50%, -50%)
      translate3d(
        calc(var(--x) + var(--px, 0px)),
        calc(var(--y) + var(--py, 0px)),
        var(--z))
      rotateY(var(--sry, 0deg))
      rotateX(var(--srx, 0deg));
    transition: opacity 0.5s ease, filter 0.5s ease;
    will-change: transform, opacity;
  }

  .card__icon {
    flex: 0 0 auto;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card__icon svg {
    width: 34px;
    height: 34px;
    stroke: #fff;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .card__text {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.22;
    color: var(--ink);
    white-space: nowrap;
  }

  /* Кросс-фейд между наборами */
  .set--hidden .card {
    opacity: 0;
    filter: blur(4px);
    pointer-events: none;
  }
  .set--visible .card {
    opacity: 1;
    filter: blur(0);
  }

  /* Переключатель — статичный, поверх сцены ------------------------- */
  .toggle {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 50;
    display: flex;
    align-items: center;
    padding: 6px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    background: #fff;
    user-select: none;
  }
  .toggle__btn {
    position: relative;
    z-index: 2;
    border: 0;
    background: transparent;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 16px 26px;
    border-radius: 999px;
    color: var(--ink);
    white-space: nowrap;
    transition: color 0.3s ease;
  }
  .toggle__btn[aria-selected="true"] { color: #fff; }
  .toggle__thumb {
    position: absolute;
    z-index: 1;
    top: 6px;
    bottom: 6px;
    border-radius: 999px;
    background: var(--ink);
    transition: left 0.35s cubic-bezier(.2,.7,.2,1),
                width 0.35s cubic-bezier(.2,.7,.2,1);
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    color: #c4c4c4;
    font-size: 13px;
    letter-spacing: .02em;
    z-index: 50;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="world" id="world"></div>
  </div>

  <div class="toggle" id="toggle" role="tablist" aria-label="Режим">
    <span class="toggle__thumb" id="thumb"></span>
    <button class="toggle__btn" role="tab" aria-selected="true"  data-set="0">Начать своё дело</button>
    <button class="toggle__btn" role="tab" aria-selected="false" data-set="1">Управлять и развивать</button>
  </div>

  <div class="hint">двигай мышкой — осмотри пространство</div>

<script>
(() => {
  // --- Иконки (линейные, белые на тёмном круге) -------------------
  const ICONS = {
    register: '<svg viewBox="0 0 32 32"><ellipse cx="16" cy="11" rx="5" ry="2.4"/><path d="M11 11v3c0 1.3 2.2 2.4 5 2.4s5-1.1 5-2.4v-3"/><ellipse cx="16" cy="19" rx="8" ry="3.6"/><path d="M8 19v2.5c0 2 3.6 3.6 8 3.6s8-1.6 8-3.6V19"/></svg>',
    salary:   '<svg viewBox="0 0 32 32"><ellipse cx="16" cy="11" rx="9" ry="4"/><path d="M7 11v5c0 2.2 4 4 9 4s9-1.8 9-4v-5"/><path d="M7 15.5c0 2.2 4 4 9 4s9-1.8 9-4"/></svg>',
    taxes:    '<svg viewBox="0 0 32 32"><path d="M10 5h12v22l-3-2-3 2-3-2-3 2z"/><path d="M13.5 11h5M13.5 15h5M13.5 19h5"/></svg>',
    account:  '<svg viewBox="0 0 32 32"><ellipse cx="13" cy="16" rx="5" ry="8.5"/><ellipse cx="19" cy="16" rx="5" ry="8.5"/></svg>',
    clients:  '<svg viewBox="0 0 32 32"><path d="M16 5a7 7 0 0 1 7 7c0 5.2-7 14-7 14s-7-8.8-7-14a7 7 0 0 1 7-7z"/><circle cx="16" cy="12" r="2.6"/></svg>',
    folder:   '<svg viewBox="0 0 32 32"><path d="M5 9h6l2.2 2.8H25a2 2 0 0 1 2 2V24a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9z"/></svg>',
    book:     '<svg viewBox="0 0 32 32"><path d="M16 9c-2.2-1.6-5.2-2.2-9-2.2V23c3.8 0 6.8.6 9 2.2 2.2-1.6 5.2-2.2 9-2.2V6.8c-3.8 0-6.8.6-9 2.2z"/><path d="M16 9v16.2"/></svg>',
    payments: '<svg viewBox="0 0 32 32"><path d="M6 12h16l-5-5"/><path d="M26 20H10l5 5"/></svg>',
  };

  // --- 8 пунктов (общие для обоих наборов) ------------------------
  const ITEMS = [
    { icon:'register', l1:'Зарегистрируем',       l2:'бизнес' },
    { icon:'salary',   l1:'Подключим зарплатный', l2:'проект' },
    { icon:'taxes',    l1:'Рассчитаем',           l2:'налоги и взносы' },
    { icon:'account',  l1:'Откроем',              l2:'счёт' },
    { icon:'clients',  l1:'Поможем найти',        l2:'новых клиентов' },
    { icon:'folder',   l1:'Настроим обмен',       l2:'документами онлайн' },
    { icon:'book',     l1:'Расскажем про бизнес', l2:'на курсах и вебинарах' },
    { icon:'payments', l1:'Настроим',             l2:'получение оплат' },
  ];

  // 8 точек раскладки в пространстве (x, y — смещение от центра, z — глубина)
  const POSITIONS = [
    { x:-560, y:-360, z: 120 },
    { x: 430, y:-380, z:-160 },
    { x:-700, y: -30, z: -40 },
    { x: 650, y:-110, z:  90 },
    { x:-470, y: 300, z: 160 },
    { x: 300, y: 330, z:-120 },
    { x: 710, y: 230, z: 110 },
    { x:-250, y:-150, z:-210 },
  ];

  // Оба набора используют те же позиции, но пункты в разном порядке
  const SET_ORDERS = [
    [0, 1, 2, 3, 4, 5, 6, 7],
    [3, 0, 5, 2, 7, 1, 4, 6],
  ];

  // Сферический доворот по смещению от центра (минимум в центре, рост к краям)
  const clamp = (v, m) => Math.max(-m, Math.min(m, v));

  const world = document.getElementById('world');

  const setEls = SET_ORDERS.map((order, si) => {
    const wrap = document.createElement('div');
    wrap.className = 'set ' + (si === 0 ? 'set--visible' : 'set--hidden');

    order.forEach((itemIdx, posIdx) => {
      const item = ITEMS[itemIdx];
      const p = POSITIONS[posIdx];

      const el = document.createElement('div');
      el.className = 'card';
      el.style.setProperty('--x', p.x + 'px');
      el.style.setProperty('--y', p.y + 'px');
      el.style.setProperty('--z', p.z + 'px');
      el.style.setProperty('--sry', clamp(p.x * 0.032, 30) + 'deg');
      el.style.setProperty('--srx', clamp(-p.y * 0.034, 22) + 'deg');
      el.dataset.depth = p.z;

      el.innerHTML =
        '<div class="card__icon">' + ICONS[item.icon] + '</div>' +
        '<div class="card__text">' + item.l1 + '<br>' + item.l2 + '</div>';

      wrap.appendChild(el);
    });

    world.appendChild(wrap);
    return wrap;
  });

  // --- Параллакс + качание сцены за курсором -----------------------
  let tx = 0, ty = 0, cx = 0, cy = 0;
  const MAX_TILT = 7;
  const allCards = () => world.querySelectorAll('.card');

  window.addEventListener('pointermove', (e) => {
    tx = (e.clientX / window.innerWidth  - 0.5) * 2;
    ty = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  function loop() {
    cx += (tx - cx) * 0.08;
    cy += (ty - cy) * 0.08;

    world.style.setProperty('--rx', ( cx * MAX_TILT) + 'deg');
    world.style.setProperty('--ry', (-cy * MAX_TILT) + 'deg');

    allCards().forEach(card => {
      const depth = parseFloat(card.dataset.depth);   // -210..160
      const k = (depth + 250) / 470;                  // ближе = больше
      const amp = 16 + k * 55;
      card.style.setProperty('--px', (-cx * amp) + 'px');
      card.style.setProperty('--py', (-cy * amp) + 'px');
    });

    requestAnimationFrame(loop);
  }
  loop();

  // --- Переключатель ----------------------------------------------
  const toggle = document.getElementById('toggle');
  const thumb  = document.getElementById('thumb');
  const btns   = [...toggle.querySelectorAll('.toggle__btn')];

  const moveThumb = (btn) => {
    thumb.style.left  = btn.offsetLeft + 'px';
    thumb.style.width = btn.offsetWidth + 'px';
  };

  function select(idx) {
    btns.forEach((b, i) => b.setAttribute('aria-selected', i === idx));
    moveThumb(btns[idx]);
    setEls.forEach((s, i) => {
      s.classList.toggle('set--visible', i === idx);
      s.classList.toggle('set--hidden',  i !== idx);
    });
  }

  btns.forEach((b, i) => b.addEventListener('click', () => select(i)));
  requestAnimationFrame(() => moveThumb(btns[0]));
  window.addEventListener('resize', () => {
    const active = btns.findIndex(b => b.getAttribute('aria-selected') === 'true');
    moveThumb(btns[active]);
  });
})();
</script>
</body>
</html>
